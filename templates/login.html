{% extends 'base.html' %}
{% load static %}

{% block title %}Log In – MyFriend{% endblock %}

{% block content %}
<div class="container my-auto">
    <div class="row justify-content-center align-items-center py-5">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card card-connecthub shadow-lg border-0 p-4">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-2" style="width: 54px; height: 54px; border-radius: 16px;">
                        <i class="fas fa-right-to-bracket fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Welcome Back</h4>
                    <p class="text-muted small">Log in to your MyFriend account</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Enter username or email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                            <a href="{% url 'password_reset' %}" class="small text-primary text-decoration-none">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3 mt-4">
                        <button type="submit" class="btn btn-accent py-2.5 fw-semibold">
                            <i class="fas fa-right-to-bracket me-2"></i> Log In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
