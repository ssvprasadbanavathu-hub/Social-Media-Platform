{% extends 'base.html' %}
{% load static %}

{% block title %}404 Page Not Found – MyFriend{% endblock %}

{% block content %}
<div class="container my-auto text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-extrabold brand-gradient">404</h1>
            <h3 class="fw-bold mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">The page or post you are looking for might have been removed, renamed, or is temporarily unavailable.</p>
            <a href="{% url 'home' %}" class="btn btn-accent px-4 py-2">
                <i class="fas fa-house me-2"></i> Return to Home Feed
            </a>
        </div>
    </div>
</div>
{% endblock %}
