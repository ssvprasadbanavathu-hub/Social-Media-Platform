{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Post – MyFriend{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-connecthub p-4">
                <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                    <h5 class="fw-bold mb-0"><i class="fas fa-pen text-info me-2"></i> Edit Post</h5>
                    <a href="{% url 'post_detail' post_id=post.id %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                        Cancel
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data" action="{% url 'edit_post' post_id=post.id %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Caption</label>
                        {{ form.caption }}
                    </div>

                    {% if post.image %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Current Image</label>
                        <div class="post-image-container mb-2" style="max-height: 200px;">
                            <img src="{{ post.image.url }}" class="img-fluid rounded-3" alt="Current Image">
                        </div>
                    </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Replace Photo</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="{% url 'post_detail' post_id=post.id %}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-accent px-4">Save Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
