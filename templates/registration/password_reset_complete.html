{% extends 'base.html' %}

{% block title %}Password Reset Complete – MyFriend{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center">
                <div class="card-body p-4 p-md-5">
                    <div class="brand-icon-box mx-auto mb-3 bg-success" style="width: 54px; height: 54px; font-size: 1.5rem;">
                        <i class="fas fa-check-circle text-white"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Password Reset Complete</h3>
                    <p class="text-muted small mb-4">
                        Your password has been reset successfully! You may now log in with your new credentials.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
                        Log In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
