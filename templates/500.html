{% extends 'base.html' %}
{% load static %}

{% block title %}500 Server Error – MyFriend{% endblock %}

{% block content %}
<div class="container my-auto text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-extrabold text-danger">500</h1>
            <h3 class="fw-bold mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">Something went wrong on our servers. Please try again in a few moments.</p>
            <a href="{% url 'home' %}" class="btn btn-accent px-4 py-2">
                <i class="fas fa-rotate me-2"></i> Reload Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
